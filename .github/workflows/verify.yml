name: verify sources

on:
  schedule:
    - cron: "15 */6 * * *"
  workflow_dispatch:
  push:
    branches: [main]

permissions:
  contents: write

# 串行化：push 与手动触发可能撞车，并发跑会同读一份旧 state、宽限计数不前进
concurrency:
  group: verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Read previous state (two-strike memory)
        uses: actions/checkout@v4
        with:
          ref: gh-pages
          path: prev
        continue-on-error: true
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Verify all channels
        run: python verify.py
      - name: Publish to gh-pages
        uses: peaceiris/actions-gh-pages@v3
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./out
